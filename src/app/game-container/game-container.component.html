<div>
  <div class="boardContainer">
    <mat-grid-list cols="3" rowHeight="200px">
      @for (cell of board$ | async; track $index) {
          <mat-grid-tile (click)="onCellClick($index)">{{ cell }}</mat-grid-tile>

      }
    </mat-grid-list>
  </div>

  <div id="gameInfo">
    @if ((gameResult$ | async) != INGAME) {
    <button id="playAgainBtn" (click)="onResetClick()">
      Play again!
    </button>
    
    }
  </div>
</div>
